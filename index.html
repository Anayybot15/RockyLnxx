<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anahi´s Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Degradado animado rosa y dorado */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #2a0813, #4a1226, #7a1c3e, #3d142b, #1f0a14);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #fff0f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Tarjeta Glassmorphism Rosa */
        .card {
            background: rgba(255, 182, 193, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 28px;
            padding: 45px 35px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(255, 105, 180, 0.2);
            position: relative;
            z-index: 10;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Badge superior */
        .badge {
            display: inline-block;
            background: rgba(255, 192, 203, 0.2);
            border: 1px solid #ffd700;
            color: #ffe4e1;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 22px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* Iconos */
        .icons {
            font-size: 2.5rem;
            margin-bottom: 18px;
            letter-spacing: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 2.3rem;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(255, 105, 180, 0.3);
        }

        p {
            color: #f8e1e7;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 300;
        }

        /* Tag de Server dinámico */
        .server-tag {
            background: rgba(20, 5, 12, 0.5);
            border-radius: 16px;
            padding: 14px 20px;
            font-family: 'Courier New', Courier, monospace;
            color: #ffb6c1;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid rgba(255, 182, 193, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #ff69b4;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff69b4;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 105, 180, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 105, 180, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 105, 180, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">✨ Special Edition ✨</span>
        <div class="icons">🌸 🌷 💖 🌷 🌸</div>
        <h1>Anahí</h1>
        <p>Servidor web activo</p>
        
        <div class="server-tag">
            <div class="pulse-dot"></div>
            <span>SERVER 1</span>
        </div>
    </div>

</body>
</html>
